<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
:root {
  --bg: #07080f;
  --glass: rgba(255,255,255,.045);
  --glass-hi: rgba(255,255,255,.075);
  --line: rgba(255,255,255,.09);
  --fg: #eef1ff;
  --dim: #8b93ad;
  --faint: #565d75;
  --accent: 122,162,255;       /* rgb triplet, eased from JS to match the orb */
  --accent2: 167,139,250;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); }

/* drifting aurora behind everything */
.aurora { position: fixed; inset: -20%; z-index: 0; opacity: .8; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; width: 60vw; height: 60vw; will-change: transform; }
.aurora i:nth-child(1) { background: radial-gradient(circle, rgba(var(--accent), .30), transparent 68%); left: 6%; top: 8%; animation: drift1 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { background: radial-gradient(circle, rgba(var(--accent2), .26), transparent 68%); right: 4%; bottom: 0; animation: drift2 32s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { background: radial-gradient(circle, rgba(56,189,248,.12), transparent 68%); left: 40%; top: 30%; width: 40vw; height: 40vw; animation: drift1 38s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(8vw, 6vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-9vw, -7vh) scale(1.1); } }
.grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .5;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.035), transparent 60%); }

.app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column;
  border: 1px solid var(--line); }

/* title bar */
.bar { height: 44px; display: flex; align-items: center; padding: 0 8px 0 18px; flex: none; }
.bar .brand { display: flex; align-items: center; gap: 10px; font: 600 12px var(--display); letter-spacing: .28em; color: var(--dim); }
.bar .pip { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--accent)); box-shadow: 0 0 12px rgb(var(--accent)); }
.bar .fill { flex: 1; height: 100%; }
.win { width: 40px; height: 32px; border-radius: 8px; color: var(--dim); display: grid; place-items: center; transition: .15s; }
.win:hover { background: var(--glass-hi); color: var(--fg); }
.win.x:hover { background: #e5484d; color: #fff; }
.win svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.4; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 4px 20px 20px; }

/* left: hero */
.hero { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
.stage { position: relative; width: 340px; height: 340px; }
canvas#orb { width: 340px; height: 340px; display: block; }
.state { font: 300 30px var(--display); letter-spacing: .02em; margin-top: 2px; transition: color .6s; }
.detail { color: var(--dim); font-size: 13px; margin-top: 4px; min-height: 20px; }
.cta { margin-top: 22px; height: 44px; min-width: 190px; padding: 0 26px; border-radius: 999px; font-weight: 600; letter-spacing: .02em;
  color: #0a0b14; background: linear-gradient(135deg, rgb(var(--accent)), rgb(var(--accent2)));
  box-shadow: 0 8px 30px -8px rgba(var(--accent), .7), inset 0 1px 0 rgba(255,255,255,.4);
  transition: transform .15s, box-shadow .2s, opacity .2s; }
.cta:hover { transform: translateY(-1px); box-shadow: 0 12px 36px -8px rgba(var(--accent), .9), inset 0 1px 0 rgba(255,255,255,.4); }
.cta:active { transform: translateY(1px) scale(.99); }
.cta[disabled] { opacity: .55; pointer-events: none; }
.chips { display: flex; gap: 10px; margin-top: 24px; }
.chip { min-width: 96px; padding: 10px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  text-align: center; }
.chip b { display: block; font: 500 17px var(--display); }
.chip span { font-size: 10px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }

/* right: glass panel */
.panel { min-height: 0; display: flex; flex-direction: column; border-radius: 22px; background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06); overflow: hidden; }
.tabs { position: relative; display: flex; gap: 6px; padding: 14px 16px 0; border-bottom: 1px solid var(--line); flex: none; }
.tab { padding: 8px 14px 14px; color: var(--dim); font-weight: 500; transition: color .2s; position: relative; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); }
.tab .n { margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--glass-hi); color: var(--dim); }
.ink { position: absolute; bottom: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgb(var(--accent)), rgb(var(--accent2)));
  transition: left .3s cubic-bezier(.3,.8,.3,1), width .3s cubic-bezier(.3,.8,.3,1); }
.pages { position: relative; flex: 1; min-height: 0; }
.page { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transform: translateY(6px); }
.page.on { display: flex; animation: in .35s cubic-bezier(.3,.8,.3,1) forwards; }
@keyframes in { to { opacity: 1; transform: none; } }

/* conversation */
.log { flex: 1; overflow-y: auto; padding: 20px 22px 8px; display: flex; flex-direction: column; gap: 14px; user-select: text; }
.msg { max-width: 82%; animation: pop .35s cubic-bezier(.3,.8,.3,1); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.msg .meta { font-size: 10px; letter-spacing: .12em; color: var(--faint); margin: 0 4px 4px; text-transform: uppercase; }
.msg .body { padding: 10px 15px; border-radius: 18px; line-height: 1.5; }
.msg.clock .body { background: var(--glass-hi); border: 1px solid var(--line); border-top-left-radius: 6px; }
.msg.you { align-self: flex-end; text-align: right; }
.msg.you .body { background: linear-gradient(135deg, rgba(var(--accent), .26), rgba(var(--accent2), .22)); border: 1px solid rgba(var(--accent), .3); border-top-right-radius: 6px; text-align: left; }
.typing { align-self: flex-start; display: none; gap: 5px; padding: 14px 16px; border-radius: 18px; border-top-left-radius: 6px; background: var(--glass-hi); border: 1px solid var(--line); }
.typing.on { display: flex; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: bob 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
.empty { margin: auto; text-align: center; color: var(--dim); line-height: 1.8; }
.empty b { display: block; font: 300 20px var(--display); color: var(--fg); margin-bottom: 4px; }
.compose { flex: none; display: flex; gap: 10px; padding: 12px 16px 16px; }
.compose input { flex: 1; height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(0,0,0,.28); border: 1px solid var(--line);
  color: var(--fg); font: inherit; outline: none; user-select: text; transition: border-color .2s, box-shadow .2s; }
.compose input:focus { border-color: rgba(var(--accent), .6); box-shadow: 0 0 0 4px rgba(var(--accent), .12); }
.compose input:disabled { opacity: .5; }
.compose input::placeholder { color: var(--faint); }
.send { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-hi); border: 1px solid var(--line); transition: .2s; }
.send:hover { background: rgba(var(--accent), .3); }
.send svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.7; }

/* reminders */
.list { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.rem { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line);
  transition: .2s; animation: pop .35s cubic-bezier(.3,.8,.3,1); }
.rem:hover { background: var(--glass-hi); transform: translateY(-1px); }
.rem .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(var(--accent), .16); color: rgb(var(--accent)); }
.rem .ico svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.rem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rem .when { font: 500 12px var(--display); color: rgb(var(--accent)); white-space: nowrap; }
.rem .x { width: 28px; height: 28px; border-radius: 8px; color: var(--faint); display: grid; place-items: center; transition: .15s; }
.rem .x:hover { background: rgba(229,72,77,.2); color: #ff8b8e; }
.rem .x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; }

/* settings */
.set { flex: 1; overflow-y: auto; padding: 8px 22px 20px; }
.row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.row .txt { flex: 1; } .row .txt b { display: block; font-weight: 500; } .row .txt span { color: var(--dim); font-size: 12px; }
.sw { position: relative; width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,.12); transition: background .25s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
.sw.on { background: linear-gradient(135deg, rgb(var(--accent)), rgb(var(--accent2))); }
.sw.on::after { transform: translateX(20px); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; padding: 20px 0 8px; font-size: 13px; }
.kv dt { color: var(--faint); } .kv dd { color: var(--fg); user-select: text; }
.btns { display: flex; gap: 10px; margin-top: 16px; }
.btn { height: 36px; padding: 0 16px; border-radius: 10px; background: var(--glass-hi); border: 1px solid var(--line); transition: .2s; }
.btn:hover { background: rgba(var(--accent), .22); border-color: rgba(var(--accent), .4); }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>

<div class="app">
  <div class="bar pywebview-drag-region">
    <div class="brand pywebview-drag-region"><span class="pip"></span>CLOCK</div>
    <div class="fill pywebview-drag-region"></div>
    <button class="win" id="min" title="Minimise"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
    <button class="win x" id="close" title="Close window (Clock keeps running)"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
  </div>

  <div class="main">
    <section class="hero">
      <div class="stage"><canvas id="orb"></canvas></div>
      <div class="state" id="state">Paused</div>
      <div class="detail" id="detail"></div>
      <button class="cta" id="cta" disabled>Start Clock</button>
      <div class="chips">
        <div class="chip"><b id="s-up">-</b><span>Uptime</span></div>
        <div class="chip"><b id="s-ex">0</b><span>Exchanges</span></div>
        <div class="chip"><b id="s-rem">0</b><span>Reminders</span></div>
      </div>
    </section>

    <section class="panel">
      <nav class="tabs" id="tabs">
        <button class="tab on" data-tab="chat">Conversation</button>
        <button class="tab" data-tab="rem">Reminders<span class="n" id="n-rem">0</span></button>
        <button class="tab" data-tab="set">Settings</button>
        <div class="ink" id="ink"></div>
      </nav>
      <div class="pages">
        <div class="page on" id="p-chat">
          <div class="log" id="log"></div>
          <form class="compose" id="compose" autocomplete="off">
            <input id="msg" placeholder="Type to Clock..." disabled>
            <button class="send" type="submit" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
        </div>
        <div class="page" id="p-rem"><div class="list" id="rems"></div></div>
        <div class="page" id="p-set">
          <div class="set">
            <div class="row"><div class="txt"><b>Speak replies</b><span>Off keeps her silent. Replies still show here.</span></div><div class="sw" data-key="voice"></div></div>
            <div class="row"><div class="txt"><b>Wake chime</b><span>A short tone when she hears her name.</span></div><div class="sw" data-key="chime"></div></div>
            <div class="row"><div class="txt"><b>On-screen HUD</b><span>A small overlay at the top-right while she works.</span></div><div class="sw" data-key="hud"></div></div>
            <dl class="kv" id="info"></dl>
            <div class="btns"><button class="btn" id="b-log">Open log</button><button class="btn" id="b-mem">Open memory</button></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = () => window.pywebview && window.pywebview.api;

/* ---------------- orb ---------------- */
const STATES = {
  off:       { c1: [84, 94, 120],   c2: [52, 60, 84],    amp: 0,    speed: .25, glow: .12, label: "Paused" },
  loading:   { c1: [251, 191, 36],  c2: [249, 115, 22],  amp: .04,  speed: 1.8, glow: .5,  label: "Waking up" },
  listening: { c1: [122, 162, 255], c2: [167, 139, 250], amp: .03,  speed: .5,  glow: .45, label: "Listening" },
  hearing:   { c1: [94, 234, 212],  c2: [96, 165, 250],  amp: .09,  speed: 1.2, glow: .8,  label: "Hearing you" },
  thinking:  { c1: [192, 132, 252], c2: [244, 114, 182], amp: .05,  speed: 2.6, glow: .7,  label: "Thinking" },
  speaking:  { c1: [34, 211, 238],  c2: [129, 140, 248], amp: .13,  speed: 1.5, glow: .9,  label: "Speaking" },
  alert:     { c1: [251, 113, 133], c2: [244, 63, 94],   amp: .02,  speed: .6,  glow: .6,  label: "Mic is off" },
};
const cv = $("orb"), ctx = cv.getContext("2d");
const SZ = 340, DPR = Math.max(1, window.devicePixelRatio || 1);
cv.width = cv.height = SZ * DPR; ctx.scale(DPR, DPR);
const cur = { c1: [...STATES.off.c1], c2: [...STATES.off.c2], amp: 0, speed: .25, glow: .12 };
let frameN = 0, target = "off", t = 0, last = performance.now(), ripples = [], nextRipple = 0;
const lerp = (a, b, k) => a + (b - a) * k;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixw = (c, w) => c.map(v => lerp(v, 255, w));
const mixk = (c, w) => c.map(v => lerp(v, 0, w));

function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  const S = STATES[target], k = 1 - Math.exp(-dt * 4);
  for (let i = 0; i < 3; i++) { cur.c1[i] = lerp(cur.c1[i], S.c1[i], k); cur.c2[i] = lerp(cur.c2[i], S.c2[i], k); }
  cur.amp = lerp(cur.amp, S.amp, k); cur.speed = lerp(cur.speed, S.speed, k); cur.glow = lerp(cur.glow, S.glow, k);
  t += dt * cur.speed;

  const cx = SZ / 2, cy = SZ / 2, R = 92 * (1 + Math.sin(now / 1000 * 1.4) * .018 * (.4 + cur.glow));
  ctx.clearRect(0, 0, SZ, SZ);

  // bloom
  let g = ctx.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.95);
  g.addColorStop(0, rgba(cur.c1, .34 * cur.glow)); g.addColorStop(.5, rgba(cur.c2, .12 * cur.glow)); g.addColorStop(1, rgba(cur.c2, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);

  // ripples while she hears or speaks
  if (target === "speaking" || target === "hearing") {
    nextRipple -= dt; if (nextRipple <= 0) { ripples.push(0); nextRipple = target === "speaking" ? .55 : .9; }
  }
  ripples = ripples.map(r => r + dt * (target === "hearing" ? .5 : .7)).filter(r => r < 1);
  for (const r of ripples) {
    ctx.beginPath(); ctx.arc(cx, cy, R * (1.05 + r * .75), 0, 7);
    ctx.strokeStyle = rgba(cur.c1, .35 * (1 - r) ** 2); ctx.lineWidth = 1.5; ctx.stroke();
  }

  // organic blob outline
  const N = 140, pts = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    const wob = .5 * Math.sin(3 * a + t * 1.3) + .32 * Math.sin(5 * a - t * 1.7 + 1.2) + .2 * Math.sin(2 * a + t * .9 + 2.4)
              + (target === "speaking" ? .25 * Math.sin(9 * a + t * 5) : 0);
    const r = R * (1 + cur.amp * wob);
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  const path = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };

  ctx.save(); path(); ctx.clip();
  g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.15);
  g.addColorStop(0, rgba(mixw(cur.c2, .3), .95)); g.addColorStop(.45, rgba(cur.c1, .95)); g.addColorStop(1, rgba(mixk(cur.c2, .55), 1));
  ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    const a = t * .7 + i * 2.1, x = cx + Math.cos(a) * R * .42, y = cy + Math.sin(a * 1.3) * R * .42;
    const lg = ctx.createRadialGradient(x, y, 0, x, y, R * .7);
    lg.addColorStop(0, rgba(i % 2 ? cur.c1 : cur.c2, .26)); lg.addColorStop(1, rgba(cur.c1, 0));
    ctx.fillStyle = lg; ctx.fillRect(0, 0, SZ, SZ);
  }
  ctx.globalCompositeOperation = "source-over";
  g = ctx.createRadialGradient(cx, cy, R * .55, cx, cy, R * 1.12);       // inner shade so it reads as a sphere
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(5,6,16,.5)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);
  ctx.save(); ctx.translate(cx - R * .3, cy - R * .5); ctx.rotate(-.5); ctx.scale(1, .55);   // glass highlight
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * .55);
  g.addColorStop(0, "rgba(255,255,255,.38)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * .55, 0, 7); ctx.fill(); ctx.restore();
  // faint clock hands: she is still a clock
  const d = new Date(), hA = ((d.getHours() % 12) + d.getMinutes() / 60) / 12 * 6.283 - 1.5708, mA = (d.getMinutes() + d.getSeconds() / 60) / 60 * 6.283 - 1.5708;
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineCap = "round";
  ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(hA) * R * .34, cy + Math.sin(hA) * R * .34); ctx.stroke();
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(mA) * R * .55, cy + Math.sin(mA) * R * .55); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, 7); ctx.fill();
  ctx.restore();

  // rim light
  path(); g = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  g.addColorStop(0, "rgba(255,255,255,.7)"); g.addColorStop(.5, "rgba(255,255,255,.06)"); g.addColorStop(1, rgba(mixw(cur.c1, .4), .35));
  ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.stroke();

  // push eased colour to the page chrome
  if ((frameN++ & 7) === 0) {
  const root = document.documentElement.style;
  root.setProperty("--accent", `${cur.c1[0] | 0},${cur.c1[1] | 0},${cur.c1[2] | 0}`);
  root.setProperty("--accent2", `${cur.c2[0] | 0},${cur.c2[1] | 0},${cur.c2[2] | 0}`);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- tabs ---------------- */
function moveInk() {
  const on = document.querySelector(".tab.on"), ink = $("ink");
  ink.style.left = on.offsetLeft + 14 + "px"; ink.style.width = on.offsetWidth - 28 + "px";
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.tab));
  moveInk();
});
addEventListener("load", () => setTimeout(moveInk, 50)); addEventListener("resize", moveInk);

/* ---------------- data ---------------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sigs = {};
const ICONS = {
  bell: '<svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1112 0v6l1.5 2h-15zM10 21h4"/></svg>',
  timer: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg>',
  x: '<svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg>',
};
const fmtUp = s => s == null ? "-" : s >= 3600 ? `${s / 3600 | 0}h ${String(s % 3600 / 60 | 0).padStart(2, "0")}m` : `${s / 60 | 0}m ${String(s % 60).padStart(2, "0")}s`;
function countdown(iso) {
  let s = Math.round((new Date(iso) - Date.now()) / 1000);
  if (s <= 0) return "due now";
  const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0;
  return "in " + (d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`);
}

function render(st) {
  target = STATES[st.state] ? st.state : "off";
  $("state").textContent = STATES[target].label;
  $("state").style.color = `rgb(${cur.c1.map(v => v | 0)})`;
  $("detail").textContent = st.running ? (st.detail || "starting") : 'Start her, then say "Hi Clock"';
  const cta = $("cta"); cta.disabled = st.busy; cta.textContent = st.busy ? "Working..." : st.running ? "Pause Clock" : "Start Clock";
  $("s-up").textContent = fmtUp(st.uptime); $("s-ex").textContent = st.exchanges; $("s-rem").textContent = st.reminders.length;
  $("n-rem").textContent = st.reminders.length; moveInk();
  const msg = $("msg"); msg.disabled = !st.running; msg.placeholder = st.running ? "Type to Clock..." : "Start Clock to type to her";

  // conversation
  const sig = JSON.stringify(st.msgs);
  if (sig !== sigs.msgs) {
    sigs.msgs = sig; const log = $("log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.innerHTML = st.msgs.length ? st.msgs.map(m => `<div class="msg ${m.who}"><div class="meta">${m.who === "you" ? "You" : "Clock"} · ${m.t}</div><div class="body">${esc(m.text)}</div></div>`).join("")
      : '<div class="empty"><b>Nothing said yet</b>Start Clock and say "Hi Clock",<br>or type below.</div>';
    log.insertAdjacentHTML("beforeend", '<div class="typing" id="typing"><i></i><i></i><i></i></div>');
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
  $("typing") && $("typing").classList.toggle("on", target === "thinking");

  // reminders
  const rs = JSON.stringify(st.reminders.map(r => [r.id, r.text]));
  if (rs !== sigs.rem) {
    sigs.rem = rs;
    $("rems").innerHTML = st.reminders.length ? st.reminders.map(r => `<div class="rem"><div class="ico">${ICONS[r.kind === "timer" ? "timer" : "bell"]}</div><div class="t">${esc(r.text)}</div><div class="when" data-due="${r.due}"></div><button class="x" data-id="${r.id}" title="Cancel">${ICONS.x}</button></div>`).join("")
      : '<div class="empty"><b>Nothing pending</b>Try: "Hi Clock, remind me at 6 to stretch".</div>';
  }
  document.querySelectorAll(".when").forEach(e => e.textContent = countdown(e.dataset.due));

  // settings
  document.querySelectorAll(".sw").forEach(e => { if (!e.dataset.lock) e.classList.toggle("on", !!st.settings[e.dataset.key]); });
  if (!sigs.info) {
    sigs.info = 1;
    $("info").innerHTML = st.info.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  }
}

async function poll() {
  try { const a = api(); if (a) render(await a.get_state()); } catch (e) { console.error(e); }
  setTimeout(poll, 500);
}

$("compose").onsubmit = e => { e.preventDefault(); const v = $("msg").value.trim(); if (v && api()) { api().send(v); $("msg").value = ""; } };
$("cta").onclick = () => { $("cta").disabled = true; api().toggle(); };
$("rems").onclick = e => { const b = e.target.closest(".x"); if (b) api().cancel(b.dataset.id); };
document.querySelectorAll(".sw").forEach(e => e.onclick = () => {
  e.classList.toggle("on"); e.dataset.lock = 1; setTimeout(() => delete e.dataset.lock, 1500);
  api().set_setting(e.dataset.key, e.classList.contains("on"));
});
$("b-log").onclick = () => api().open_log(); $("b-mem").onclick = () => api().open_memory();
$("min").onclick = () => api().minimize(); $("close").onclick = () => api().close();
addEventListener("pywebviewready", poll);
</script>
</body>
</html>
